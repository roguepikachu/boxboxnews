name: Daily F1 Rumor Post

on:
  schedule:
    - cron: '0 9 */4 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post-rumor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          GEMINI_TEXT_MODEL: ${{ vars.GEMINI_TEXT_MODEL }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
          IMAGEN_MODEL: ${{ vars.IMAGEN_MODEL }}
        run: python -m src.main

      - name: Commit dedup history
        run: |
          git config user.name "boxboxnews-bot"
          git config user.email "bot@boxboxnews.com"
          # Save our updated file, pull latest, then re-apply
          cp data/posted_history.json /tmp/posted_history.json
          git checkout -- data/posted_history.json
          git pull origin main
          cp /tmp/posted_history.json data/posted_history.json
          git add data/posted_history.json
          git diff --cached --quiet || git commit -m "chore: update post history [skip ci]"
          git push

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-debug-${{ github.run_number }}
          path: output/
          retention-days: 7
